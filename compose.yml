services:
  share:
    build: .
    ports: ["127.0.0.1:5000:5000"]
    environment:
      SHARE_TRUST_PROXY: "1"   # à retirer si pas de reverse proxy devant
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    restart: unless-stopped
